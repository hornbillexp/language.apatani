---
layout: default
---

<article class="dictionary-entry">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.ipa %}<p><strong>IPA:</strong> {{ page.ipa }}</p>{% endif %}
    {% if page.pos %}<p><strong>Part of speech:</strong> {{ page.pos }}</p>{% endif %}
  </header>

  <div class="entry-body">
    {{ content }}
  </div>

  {% if page.audio %}
  <footer>
    <audio controls>
      <source src="{{ page.audio }}" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </footer>
  {% endif %}
</article>
